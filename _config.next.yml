# ------------------------------------------------------------------
# NexT 主题配置
# 完整选项: https://theme-next.js.org/docs/theme-settings/
# ------------------------------------------------------------------

# 外观方案: Muse | Mist | Pisces | Gemini
scheme: Gemini

# 主题主色（链接、选中态、侧栏高亮、顶部条等）
theme_color:
  light: "#4AA26F"
  dark: "#4AA26F"

# 暗黑模式: 跟随系统 / 可手动切换
darkmode: true

favicon:
  small: /images/favicon-16x16.png
  medium: /images/favicon-32x32.png
  apple_touch_icon: /images/apple-touch-icon.png
  safari_pinned_tab: /images/favicon.svg

# 自定义样式与脚本（MD3 皮肤）
custom_file_path:
  style: source/_data/styles.styl
  bodyEnd: source/_data/body-end.njk

# ---------------------------------------------------------------- Menu
menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive

menu_settings:
  icons: true
  badges: false

# ---------------------------------------------------------------- Sidebar
sidebar:
  position: left
  display: post
  offset: 12

avatar:
  url: /images/avatar.png
  rounded: true
  rotated: true

social:
  GitHub: https://github.com/X-CODER-ocs || fab fa-github
  # E-Mail: mailto:yourname@example.com || fa fa-envelope

# ---------------------------------------------------------------- Footer
footer:
  icon:
    name: fa fa-heart
    animated: true
    color: "#ff0000"
  since: 2026
  powered: true
  beian:
    enable: false

# ---------------------------------------------------------------- Post
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true
  symbols_count_time: true

excerpt_description: true
read_more_btn: true

# 代码高亮
codeblock:
  theme:
    light: default
    dark: stackoverflow-dark
  copy_button:
    enable: true
  fold:
    enable: false

# 字数统计 & 阅读时长（依赖 hexo-word-counter）
symbols_count_time:
  separated_meta: true
  item_text_total: true

# ---------------------------------------------------------------- Search
# 本地搜索（依赖 hexo-generator-searchdb）
local_search:
  enable: true
  preload: false
  top_n_per_article: 1
  unescape: false

# ---------------------------------------------------------------- Mermaid
# 流程图 / 时序图 / 架构图（依赖 hexo-filter-mermaid-diagrams）
# 文章里用 ```mermaid 代码块即可渲染
mermaid:
  enable: true

# ------------------------------------------------------------ Extensions
motion:
  enable: true

creative_commons:
  license: by
  sidebar: false
  post: true
  language: deed.zh

# 评论系统：Utterances（基于 GitHub Issues，无需任何密钥）
comments:
  style: tabs
  active: utterances

# Utterances —— 评论存进 X-CODER-ocs/blog 仓库的 Issues
utterances:
  enable: true
  repo: X-CODER-ocs/blog
  issue_term: pathname        # 用文章路径作为 issue 标识
  theme: github-light         # 浅色，与 #4AA26F 主题搭配

# ------------------------------------------------------------ RSS
# 配合 hexo-generator-feed 生成的 atom.xml，在站点底部/社交区显示 RSS 图标
follow_me:
  RSS: /atom.xml || fa fa-rss

# ------------------------------------------------------------ 阅读进度
# 右下角回到顶部按钮 + 阅读百分比
back2top:
  enable: true
  sidebar: false
  scrollpercent: true
