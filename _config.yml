# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: X-CODER
subtitle: '仓颉的博客!'
description: 'X-CODER 的技术博客，分享编程、开发、开源等相关内容。'
keywords: X-CODER, 技术, 博客
author: X-CODER
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://x-coder-ocs.github.io/blog
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
# 搜索引擎站点验证文件（Google / Bing / 百度）
# 官方要求：验证通过后文件须永久保留在站点根，删除会导致验证失效、收录被取消。
# ⚠️ 必须列入 skip_render，否则 hexo 会把 .html 当 page 套上 NexT 模板，
#    输出 13KB 完整网页，验证串被淹没导致验证失败。
# ⚠️ 勿删、勿改名、勿移出 source/ 根（子路径站点根 = source/，非 source/blog/）。
skip_render:
  - 'google*.html'
  - 'BingSiteAuth.xml'
  - 'baidu_verify_*.html'

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# RSS / Atom Feed
## 由 hexo-generator-feed 生成，NexT 会自动在站点挂出 RSS 图标
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: false
  content_limit: 140
  content_limit_deluxe:
  order_by: -date

# Sitemap 站点地图（hexo-generator-sitemap，利于搜索引擎收录）
sitemap:
  path: sitemap.xml

# 站内本地搜索（依赖 hexo-generator-searchdb，NexT 已启用 local_search）
search:
  path: search.xml
  field: post
  content: true
  format: html

# 文章加密（hexo-blog-encrypt，文章 front-matter 加 password 即生效）
encrypt:
  enable: true

# markdown-it 渲染器（替代默认 hexo-renderer-marked，支持脚注/任务清单/上下标/标记）
# 需先卸载默认 marked 渲染器，否则冲突
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: false
    quotes: '“”‘’'
  plugins:
    - markdown-it-footnote
    - markdown-it-mark
    - markdown-it-sub
    - markdown-it-sup
    - name: markdown-it-task-lists
      options:
        enabled: true
        label: true
        labelAfter: true
  anchors:
    level: 2
    permalink: true
    permalinkClass: header-anchor
    permalinkSymbol: ¶

# 首页自动摘要（按字数截断，省去手动 <!-- more -->）
excerpt_length: 220

# 外链自动加 rel="nofollow noopener"（SEO + 防权重流失）
nofollow:
  enable: true
  field: site
  exclude:
    - x-coder-ocs.github.io

# 文末相关文章（hexo-related-popular-posts，本地按标签相似度，无需任何账号）
# 显示位置/标题/数量在主题模板 _macro/post.njk 的 popular_posts() 里设置

# GitHub 风 emoji 短码（:rocket: :bug: 等渲染成图标，正文按需使用）
githubEmojis:
  enable: true
  className: github-emoji
  inject: true
  styles:
  customEmojis:

# 浏览器内写文后台（仅本地 hexo server 时可用；部署的静态站不会暴露此功能）
# ⚠️ 默认账号 xcoder / 密码 x-coder-blog，请尽快访问 /admin/ 设置页修改！
admin:
  username: xcoder
  password_hash: $2a$10$5/.nq6fnIryqb2shKX3Xa.zLzdt..xGLAmGjKKexFNQaqAXqiwrTy
  secret: change-this-secret-xcoder-blog-2026

# PWA / 离线缓存（hexo-offline，零配置即用：地址栏出现「安装」按钮，断网可看已读文章）

# 搜索引擎收录推送（hexo-submit-urls-to-search-engine：百度 + Google + 必应 三合一）
# 注意：实际「提交」发生在 hexo deploy 阶段（CI 在 build 后已加该步骤）。
# token 不写死在配置里，走 CI 环境变量（仓库 Secrets）：
#   BAIDU_TOKEN  = 百度搜索资源平台「推送接口」里的 token
#   BING_TOKEN   = Bing Webmaster Tools 的 IndexNow API key
#   GOOGLE_KEY_JSON = Google 服务账号私钥 JSON（整段），CI 写入 google-key.json 后由 google_key_file 引用
hexo_submit_urls_to_search_engine:
  submit_condition: count
  count: 10
  period: 900
  txt_path: urls.txt
  replace: 0
  baidu: 0                # 百度推送暂关：BAIDU_TOKEN 未配置，配好后改回 1 并在 CI env 注入
  baidu_host: https://x-coder-ocs.github.io/blog
  baidu_token: 0          # 0 = 从环境变量 BAIDU_TOKEN 读取
  bing: 1
  bing_host: https://x-coder-ocs.github.io/blog
  bing_token: 0           # 0 = 从环境变量 BING_TOKEN 读取
  google: 1
  google_host: https://x-coder-ocs.github.io/blog
  google_key_file: google-key.json   # CI 中由 secrets.GOOGLE_KEY_JSON 写入；本地无此文件时 hexo deploy 会报错（仅 deploy 阶段，不影响 generate）
  google_proxy: 0

# 内容开放 API（hexo-generator-json-content：输出 public/content.json，供自家 App / 小程序 / 全文搜索调用）
jsonContent:
  meta: true
  pages: false
  posts:
    title: true
    date: true
    path: true
    text: true
    raw: false
    content: false
    slug: false
    updated: false
    comments: false
    tag: true
    category: false
    author: true
    excerpt: false
  exclude: []

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
# 本博客实际发版由 GitHub Actions（actions/deploy-pages）完成；
# 下面的 cjh_* submitter 仅用于「部署时顺手把 URL 推给搜索引擎」，不负责页面发布。
deploy:
  - type: cjh_baidu_url_submitter
  - type: cjh_bing_url_submitter
  - type: cjh_google_url_submitter
