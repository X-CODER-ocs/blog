name: Deploy FluentNext to GitHub Pages

# 架构：.NET 后端生成器(独立仓库 fluentnext-backend) 产内容数据，
#       Blazor WASM 前端(独立仓库 fluentnext-frontend) 负责界面。
#       本仓库(blog)只放 Markdown 文章(source/_posts) + 图片(source/images) + 验证文件。
#       不再使用 Hexo / Node。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓库：文章 / 图片 / 搜索引擎验证文件
      - name: Checkout blog
        uses: actions/checkout@v4

      # 前端（Blazor WASM）独立仓库
      - name: Checkout FluentNext 前端
        uses: actions/checkout@v4
        with:
          repository: X-CODER-ocs/fluentnext-frontend
          path: fluentnext-src

      # 后端生成器（.NET 控制台）独立仓库
      - name: Checkout FluentNext 后端
        uses: actions/checkout@v4
        with:
          repository: X-CODER-ocs/fluentnext-backend
          path: fluentnext-backend

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── 后端：读 Markdown → 产 content.json / atom.xml / sitemap.xml / search.xml + 拷 images ──
      - name: Run backend generator (content.json 等)
        run: |
          set -e
          dotnet run -c Release --project fluentnext-backend -- \
            --input source/_posts \
            --images source/images \
            --site fluentnext-backend/site.json \
            --output public
          echo "后端产物:"; ls -la public
          echo "content.json 文章数:"; grep -o '"slug"' public/api/content.json | wc -l

      # ── 前端：构建 Blazor WASM → .fn-dist/wwwroot ──
      - name: Build FluentNext 前端 (dotnet publish)
        run: dotnet publish fluentnext-src/FluentNext.Frontend.csproj -c Release -o .fn-dist

      # GitHub Pages 子路径 /blog/：<base href="/"> → /blog/
      - name: Rewrite base href to /blog/
        run: |
          sed -i 's#<base href="/" />#<base href="/blog/" />#' .fn-dist/wwwroot/index.html
          echo "base href -> $(grep -o '<base href="[^"]*"' .fn-dist/wwwroot/index.html)"

      # ⚠️ .NET 发布把 blazor.webassembly.js 指纹化为哈希文件名。index.html 里的经典
      # <script src="_framework/blazor.webassembly.js"> 不受 importmap 管辖，会请求不存在的无哈希文件 → 404。
      # 改写指向真实哈希文件。
      - name: Fix Blazor boot script fingerprint
        run: |
          HASHED=$(ls .fn-dist/wwwroot/_framework/blazor.webassembly.*.js 2>/dev/null | head -1 | xargs -n1 basename)
          if [ -z "$HASHED" ]; then
            echo "::error::找不到 blazor.webassembly.*.js，发布产物异常"
            exit 1
          fi
          sed -i "s#src=\"_framework/blazor.webassembly.js\"#src=\"_framework/$HASHED\"#" .fn-dist/wwwroot/index.html
          echo "boot script -> _framework/$HASHED"
          grep -n 'blazor.webassembly' .fn-dist/wwwroot/index.html

      # 删除 Blazor 运行时 js 的 sourceMappingURL 注释：Release 不发布 .map，DevTools 开启时会 404（无害）。
      - name: Strip Blazor source map references
        run: find .fn-dist/wwwroot/_framework -name '*.js' -exec sed -i '/sourceMappingURL=/d' {} +

      # 把前端发布产物并入 public/（不含 --delete，保留后端产出的 api/ 与 feed 文件）
      - name: Copy FluentNext 前端到 public/
        shell: bash
        run: |
          set -e
          rsync -a .fn-dist/wwwroot/ public/
          # GitHub Pages Actions 部署不经 Jekyll，加 .nojekyll 防止 _framework/_content 被忽略
          : > public/.nojekyll
          # SPA 深链兜底：未知路径回退到 Blazor 入口，由客户端路由接管
          cp public/index.html public/404.html
          REDIRECT='<script>try{if(location.pathname.charAt(0)==="/"&&!location.pathname.startsWith("/blog/")){location.replace("/blog"+location.pathname+location.search+location.hash);}}catch(e){}<\/script>'
          sed -i "s#<head>#<head>$REDIRECT#" public/404.html
          echo "404.html 兜底注入条数:"; grep -c 'location.pathname.startsWith' public/404.html

      # 拷贝搜索引擎站点验证文件（来源：本仓库 source/ 根目录，官方要求永久保留）
      - name: Copy search engine auth files
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          for f in source/BingSiteAuth.xml source/google*.html source/baidu_verify_*.html; do
            cp "$f" public/ 2>/dev/null || true
          done
          ls public | grep -iE 'BingSiteAuth|google|baidu' || echo "(无验证文件，跳过)"

      # 守卫：验证文件缺失或被渲染(>1000字节)则阻断部署
      - name: Guard search engine auth files
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          files=(public/BingSiteAuth.xml public/google*.html public/baidu_verify_*.html)
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少搜索引擎验证文件 $f（勿删，官方要求永久保留）"
              exit 1
            fi
            size=$(wc -c < "$f")
            if [ "$size" -gt 1000 ]; then
              echo "::error::$(basename "$f") 大小 ${size} 字节，疑似被渲染，检查来源"
              exit 1
            fi
            echo "OK: $(basename "$f") (${size} 字节，纯文本)"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
