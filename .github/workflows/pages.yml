name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean
        run: npx hexo clean

      - name: Build
        run: npx hexo generate

      # 搜索引擎收录推送：必应（BING_TOKEN 走环境变量）+ Google（读 google-key.json 文件）
      #
      # ⚠️ 关键约束：secrets context 不能用于 step/job 的 if 条件（GitHub 仅允许
      #    github / needs / vars / inputs / env 等 context）。在 if 里写 secrets.X 会直接
      #    导致 workflow 文件解析失败、一个 job 都跑不起来（run 名会退化成文件路径）。
      #    因此统一改为：secrets 注入 env，在 shell 里判断是否为空。
      #
      # 百度暂未启用：BAIDU_TOKEN 未配置（_config.yml 中 baidu: 0）。
      # 待配置后：_config.yml 的 baidu 改回 1，并在下面 env 增加 BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
      - name: Write Google Indexing key
        env:
          GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
        run: |
          if [ -n "$GOOGLE_KEY_JSON" ]; then
            echo "$GOOGLE_KEY_JSON" > google-key.json
            echo "已写入 google-key.json（插件 google_submitter 用 require 读此文件）"
          else
            echo "GOOGLE_KEY_JSON 未配置，跳过写入"
          fi

      - name: Submit URLs to search engines
        continue-on-error: true
        env:
          BING_TOKEN: ${{ secrets.BING_TOKEN }}
        run: |
          if [ -z "$BING_TOKEN" ] && [ ! -f google-key.json ]; then
            echo "必应 / Google 密钥均未配置，跳过推送"
            exit 0
          fi
          npx hexo deploy

      # 搜索引擎站点验证文件守卫：Google / Bing 官方要求验证文件永久保留在站点根。
      # 若文件被误删、或 _config.yml 的 skip_render 被误改导致 .html 被套模板渲染，
      # 均会让验证失效。此处构建后强制校验，不通过则阻断部署。
      # 用 glob 动态匹配，验证文件换名（如换账户后哈希变化）时无需改动本步。
      - name: Guard search engine auth files
        shell: bash
        run: |
          set -e
          # 用 bash 数组 + nullglob 收集验证文件：换名（换账户后哈希变化）无需改动本步
          shopt -s nullglob
          files=(public/BingSiteAuth.xml public/google*.html public/baidu_verify_*.html)
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少搜索引擎验证文件 $f（勿删，官方要求永久保留）"
              exit 1
            fi
            size=$(wc -c < "$f")
            if [ "$size" -gt 1000 ]; then
              echo "::error::$(basename "$f") 大小 ${size} 字节，疑似被渲染，检查 _config.yml 的 skip_render"
              exit 1
            fi
            echo "OK: $(basename "$f") (${size} 字节，纯文本)"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
