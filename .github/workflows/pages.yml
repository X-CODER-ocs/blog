name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean
        run: npx hexo clean

      - name: Build
        run: npx hexo generate

      # Google Indexing API 暂未启用：需先在 Google Search Console 验证站点并创建服务账号，
      # 拿到 GOOGLE_KEY_JSON 后取消下面注释、并在仓库 Secrets 填入，再重新启用。
      # - name: Write Google Indexing key (if provided)
      #   if: ${{ secrets.GOOGLE_KEY_JSON != '' }}
      #   run: echo "${{ secrets.GOOGLE_KEY_JSON }}" > google-key.json

      # 搜索引擎收录推送(百度/必应/Google)暂未启用：当前仓库 Secrets 中 BAIDU_TOKEN / BING_TOKEN / GOOGLE_KEY_JSON 均未配置，
      # 在 workflow 的 if/env 中引用未定义 secret 会导致 "workflow file issue" 启动失败。待三者都配置到仓库 Secrets 后，
      # 取消下面注释并重新启用（同时按需恢复 Google key 写入步）。
      # - name: Submit URLs to search engines
      #   continue-on-error: true
      #   if: ${{ secrets.BAIDU_TOKEN != '' || secrets.BING_TOKEN != '' }}
      #   run: npx hexo deploy
      #   env:
      #     BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
      #     BING_TOKEN: ${{ secrets.BING_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
