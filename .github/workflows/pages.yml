name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean
        run: npx hexo clean

      - name: Build
        run: npx hexo generate

      # 写入 Google Indexing API 服务账号密钥（由 Secret 提供，文件绝不入库）。
      # 插件 google_submitter 用 require() 读 base_dir 下的 google-key.json 文件，不走环境变量，故必须先落盘。
      - name: Write Google Indexing key
        if: ${{ secrets.GOOGLE_KEY_JSON != '' }}
        run: echo "${{ secrets.GOOGLE_KEY_JSON }}" > google-key.json

      # 搜索引擎收录推送：必应（BING_TOKEN 走环境变量）+ Google（读 google-key.json 文件）
      # ⚠️ 百度暂未启用：BAIDU_TOKEN 尚未配置（_config.yml 中 baidu: 0）。
      #    切勿在 if/env 中引用未定义的 secret，否则触发 "workflow file issue" 导致整个 workflow 启动失败。
      #    待 BAIDU_TOKEN 配置后：_config.yml 的 baidu 改回 1，并在下面 env 增加 BAIDU_TOKEN。
      - name: Submit URLs to search engines
        continue-on-error: true
        if: ${{ secrets.BING_TOKEN != '' || secrets.GOOGLE_KEY_JSON != '' }}
        run: npx hexo deploy
        env:
          BING_TOKEN: ${{ secrets.BING_TOKEN }}

      # 搜索引擎站点验证文件守卫：Google / Bing 官方要求验证文件永久保留在站点根。
      # 若文件被误删、或 _config.yml 的 skip_render 被误改导致 .html 被套模板渲染，
      # 均会让验证失效。此处构建后强制校验，不通过则阻断部署。
      # 用 glob 动态匹配，验证文件换名（如换账户后哈希变化）时无需改动本步。
      - name: Guard search engine auth files
        shell: bash
        run: |
          set -e
          # 用 bash 数组 + nullglob 收集验证文件：换名（换账户后哈希变化）无需改动本步
          shopt -s nullglob
          files=(public/BingSiteAuth.xml public/google*.html public/baidu_verify_*.html)
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少搜索引擎验证文件 $f（勿删，官方要求永久保留）"
              exit 1
            fi
            size=$(wc -c < "$f")
            if [ "$size" -gt 1000 ]; then
              echo "::error::$(basename "$f") 大小 ${size} 字节，疑似被渲染，检查 _config.yml 的 skip_render"
              exit 1
            fi
            echo "OK: $(basename "$f") (${size} 字节，纯文本)"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
